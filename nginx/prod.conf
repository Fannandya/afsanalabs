upstream php_backend {
    server app:9000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # File upload Laravel (volume uploads-data, read-only di kontainer ini).
    location /storage/ {
        alias /srv/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Semua rute backend Laravel (API, Sanctum, healthcheck).
    location ~ ^/(api/|sanctum/|health|up) {
        fastcgi_pass php_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # SPA statis: file ada diserve, selain itu fallback index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
